
services:
  web:
    build:
      context: .
      dockerfile: docker/dockerfile
    command: gunicorn app.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "1"
      DATABASE_URL: postgres://django:django@db:5432/django
      CELERY_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: django
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
  
  celery:
    build:
      context: .
      dockerfile: docker/dockerfile
    command: celery -A app worker -l info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://django:django@db:5432/django
      CELERY_URL: redis://redis:6379/0
    depends_on:
      - web
      - redis

volumes:
  postgres_data:
